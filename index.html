<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff9e9">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖍️</text></svg>">
<title>Minik Ressam — Boyama Oyunu</title>
<style>
:root{--ink:#383651;--cream:#fff9e9;--purple:#7358d8;--pink:#ff8ca3;--mint:#bcebd7;--shadow:0 10px 28px #53477b18}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 2%,#fff 0,transparent 35%),var(--cream);font-family:'Trebuchet MS',ui-rounded,system-ui,sans-serif;color:var(--ink)}button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:4px solid #ffbc42;outline-offset:3px}.app{max-width:1180px;margin:auto;padding:16px 24px 22px}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px}.brand-icon{width:48px;height:48px;border-radius:16px;background:#ffe487;display:grid;place-items:center;font-size:28px;box-shadow:0 5px 0 #f3cb5c}.brand h1{font-size:clamp(20px,3vw,27px);margin:0;font-weight:900;letter-spacing:-.7px}.brand p{margin:2px 0 0;color:#88839d;font-weight:700;font-size:12px}.top-actions{display:flex;align-items:center;gap:10px}.pill{border:0;border-radius:16px;padding:11px 15px;background:#fff;box-shadow:0 4px 0 #eee8d8;font-weight:800;display:flex;align-items:center;gap:7px}.pill:active,.picture-btn:active,.palette-btn:active{transform:translateY(2px);box-shadow:none}.star-count{color:#8b6817;background:#fff0bd}.layout{display:grid;grid-template-columns:minmax(0,1fr) 212px;gap:18px;margin-top:12px}.art-card,.side-card{border:3px solid #fff;background:#fff;border-radius:28px;box-shadow:var(--shadow)}.art-card{min-height:510px;display:flex;flex-direction:column;overflow:hidden}.canvas-head{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:10px}.picture-title{font-size:17px;font-weight:900;display:flex;gap:8px;align-items:center}.hint{font-size:13px;font-weight:700;color:#9a96aa}.picture-area{flex:1;min-height:410px;margin:0 13px 13px;border-radius:22px;background:#e8f7ff;position:relative;overflow:hidden;display:grid;place-items:center}.picture-area:before,.picture-area:after{content:'';position:absolute;border-radius:50%;background:#fff9;pointer-events:none}.picture-area:before{width:160px;height:160px;top:-95px;left:8%}.picture-area:after{width:200px;height:200px;bottom:-142px;right:5%}svg.art{width:min(100%,800px);height:100%;max-height:490px;position:relative;z-index:1;overflow:visible}.region{fill:#fffdf6;stroke:#39364e;stroke-width:4;stroke-linejoin:round;stroke-linecap:round;cursor:crosshair;transition:fill .12s}.region:hover{filter:brightness(.96)}.line{fill:none;stroke:#39364e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.detail{fill:#39364e;stroke:#39364e;stroke-width:2;pointer-events:none}.eye{fill:#39364e;stroke:none;pointer-events:none}.side-card{padding:18px 15px;display:flex;flex-direction:column;gap:13px}.side-title{font-size:16px;font-weight:900;margin:0}.color-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.palette-btn{height:48px;width:48px;border:3px solid #fff;border-radius:17px;box-shadow:0 3px 8px #423b5920;position:relative;justify-self:center;transition:transform .12s,box-shadow .12s}.palette-btn.selected{outline:3px solid var(--ink);outline-offset:2px;transform:scale(1.08)}.palette-btn.selected:after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-weight:1000;font-size:22px;color:#fff;text-shadow:0 1px 3px #4448}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:3px}.tool-btn{border:0;background:#f5f1ff;border-radius:14px;padding:11px 7px;font-size:12px;font-weight:800;box-shadow:0 3px 0 #e7e0f7}.tool-btn.active{background:#e8e0ff;color:#543aba}.tool-btn:active{transform:translateY(2px);box-shadow:none}.tool-btn span{display:block;font-size:21px;margin-bottom:3px}.mini-note{margin-top:auto;border-radius:16px;background:#fff6d8;padding:11px;font-size:12px;line-height:1.45;font-weight:700;color:#78663e}.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:15px}.switcher{display:flex;align-items:center;gap:10px}.picture-btn{border:0;background:#fff;border-radius:15px;padding:8px 11px;box-shadow:0 4px 0 #ebe5d7;font-size:20px;font-weight:900;min-width:48px}.picture-name{font-weight:900;font-size:14px;min-width:90px;text-align:center}.dots{display:flex;gap:7px;justify-content:center}.dot{width:10px;height:10px;border:0;border-radius:50%;padding:0;background:#d7d1e6}.dot.active{background:var(--purple);width:23px;border-radius:9px}.save-btn{justify-self:end;border:0;border-radius:16px;padding:12px 17px;background:#7a62dc;color:#fff;font-weight:900;box-shadow:0 5px 0 #5c45b8}.save-btn:active{transform:translateY(3px);box-shadow:none}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#39364e;color:white;padding:13px 19px;border-radius:18px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:5;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.sparkle{animation:pop .45s ease}@keyframes pop{50%{transform:scale(1.03)}}
@media(max-width:750px){.app{padding:10px 12px 16px}.topbar{height:56px}.brand-icon{width:42px;height:42px;border-radius:14px}.top-actions .pill{padding:9px 11px}.layout{grid-template-columns:1fr;gap:10px;margin-top:8px}.art-card{min-height:0}.canvas-head{height:44px;padding:0 15px}.picture-area{min-height:clamp(290px,52vh,440px);margin:0 8px 8px}.side-card{padding:12px 13px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:9px 12px}.side-title{grid-column:1}.color-grid{grid-column:1;grid-row:2;grid-template-columns:repeat(6,1fr);gap:6px}.palette-btn{height:40px;width:40px;border-radius:14px}.tools{grid-column:2;grid-row:1/3;grid-template-columns:1fr;width:86px}.tool-btn{padding:6px;font-size:11px}.tool-btn span{font-size:18px;margin:0}.mini-note{display:none}.bottom{margin-top:11px;gap:4px}.picture-btn{min-width:42px;padding:7px;font-size:18px}.picture-name{min-width:76px;font-size:12px}.save-btn{padding:10px 12px;font-size:13px}.hint{font-size:11px}}
@media(max-width:390px){.app{padding-inline:8px}.brand p{display:none}.top-actions{gap:6px}.top-actions .pill{font-size:12px}.color-grid{gap:4px}.palette-btn{width:35px;height:35px;border-radius:12px}.picture-name{min-width:68px}.switcher{gap:6px}}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
  <div class="brand"><div class="brand-icon">🖍️</div><div><h1>Minik Ressam</h1><p>Renklerle harika şeyler yap!</p></div></div>
  <div class="top-actions"><div class="pill star-count" aria-label="Kazanılan yıldızlar">⭐ <span id="stars">0</span></div><button class="pill" id="soundBtn" aria-label="Sesi aç veya kapat">🔊 Ses</button></div>
</header>
<section class="layout" aria-label="Boyama alanı">
  <div class="art-card"><div class="canvas-head"><div class="picture-title"><span id="titleEmoji">🐱</span><span id="artTitle">Sevimli Kedi</span></div><div class="hint">Bir renge dokun, sonra resme dokun! 👆</div></div><div class="picture-area" id="pictureArea"></div></div>
  <aside class="side-card"><h2 class="side-title">🎨 Renk seç</h2><div class="color-grid" id="palette" aria-label="Renk paleti"></div>
    <div class="tools"><button class="tool-btn" id="eraserBtn"><span>🧽</span>Silgi</button><button class="tool-btn" id="clearBtn"><span>✨</span>Baştan</button></div>
    <div class="mini-note">Her parçaya dokun ve rengini değiştir. Yanlış mı oldu? Silgiyi kullan! 🌈</div>
  </aside>
</section>
<nav class="bottom" aria-label="Resim seçimi"><div class="switcher"><button class="picture-btn" id="prevBtn" aria-label="Önceki resim">‹</button><span class="picture-name" id="pictureName">Kedi</span><button class="picture-btn" id="nextBtn" aria-label="Sonraki resim">›</button></div><div class="dots" id="dots"></div><button class="save-btn" id="saveBtn">📸 Resmimi sakla</button></nav>
</main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const colors=[['#ff6b6b','Kırmızı'],['#ff9f43','Turuncu'],['#ffd93d','Sarı'],['#72d572','Yeşil'],['#48c9b0','Turkuaz'],['#55a8ff','Mavi'],['#9b75e8','Mor'],['#ff83b5','Pembe'],['#8c6245','Kahverengi'],['#44445a','Siyah'],['#ffffff','Beyaz'],['#bdeaff','Açık mavi']];
const pics=[
 {name:'Kedi',title:'Sevimli Kedi',emoji:'🐱',sky:'#e8f7ff',svg:`<svg class="art" viewBox="0 0 800 520" role="img" aria-label="Boyanabilir sevimli kedi resmi"><g class="region-group">
 <path class="region" d="M45 405 Q78 375 120 400 Q155 360 200 400 L200 475 L45 475Z"/><path class="region" d="M600 410 Q645 370 685 405 Q725 370 765 405 L765 475 L600 475Z"/>
 <path class="region" d="M105 128 Q128 86 177 110 Q210 66 242 122 Q280 91 308 137 L298 190 L119 193Z"/>
 <path class="region" d="M495 115 Q532 75 568 112 Q613 77 643 123 Q685 93 710 141 L695 190 L507 188Z"/>
 <path class="region" d="M274 155 L292 63 Q296 43 314 59 L370 112 Q411 101 451 113 L505 60 Q523 45 527 70 L541 164 Q594 211 592 290 Q590 406 407 416 Q225 413 215 295 Q208 218 274 155Z"/>
 <path class="region" d="M274 155 L292 63 Q296 43 314 59 L370 112 Q327 122 287 168Z"/><path class="region" d="M451 113 L505 60 Q523 45 527 70 L541 164 Q500 127 451 113Z"/>
 <path class="region" d="M250 315 Q247 278 282 267 Q310 257 325 286 L329 407 L252 393Z"/><path class="region" d="M482 286 Q499 258 531 268 Q563 280 558 315 L554 393 L479 407Z"/>
 <path class="region" d="M575 331 Q620 318 640 344 Q654 365 630 380 Q613 390 589 372 Q560 360 575 331Z"/><path class="region" d="M382 326 Q404 311 424 326 Q434 337 404 355 Q394 355 382 326Z"/>
 <path class="region" d="M160 346 Q173 330 189 346 Q201 362 182 372 Q164 373 160 346Z"/><path class="region" d="M665 331 Q681 315 697 333 Q706 350 686 359 Q670 359 665 331Z"/>
 </g><path class="line" d="M321 263 Q341 248 361 263 M447 263 Q467 248 487 263 M402 292 Q394 299 401 306 L411 306 Q418 299 410 292 M405 307 Q389 322 374 312 M405 307 Q421 322 436 312 M373 299 L328 292 M373 306 L329 310 M438 299 L480 292 M438 306 L480 310"/><circle class="eye" cx="348" cy="278" r="6"/><circle class="eye" cx="461" cy="278" r="6"/><path class="line" d="M302 173 Q326 153 353 171 M460 170 Q486 152 511 176"/><circle class="detail" cx="288" cy="294" r="3"/><circle class="detail" cx="513" cy="294" r="3"/>
 </svg>`},
 {name:'Roket',title:'Uzay Roketi',emoji:'🚀',sky:'#eeeaff',svg:`<svg class="art" viewBox="0 0 800 520" role="img" aria-label="Boyanabilir roket ve yıldızlar"><g>
 <path class="region" d="M70 390 Q106 369 140 390 L140 424 Q103 438 70 424Z"/><path class="region" d="M640 112 Q675 91 708 112 L708 146 Q675 160 640 146Z"/>
 <path class="region" d="M376 100 Q399 70 422 100 Q438 124 400 150 Q361 125 376 100Z"/>
 <path class="region" d="M242 187 Q271 133 400 97 Q529 133 558 187 L523 360 L277 360Z"/>
 <path class="region" d="M277 360 L218 419 Q207 429 207 408 L220 311 Q243 339 277 360Z"/><path class="region" d="M523 360 L582 419 Q593 429 593 408 L580 311 Q557 339 523 360Z"/>
 <path class="region" d="M329 156 Q345 132 362 156 L373 181 Q345 203 318 181Z"/><path class="region" d="M438 156 Q455 132 472 156 L483 181 Q455 203 428 181Z"/>
 <path class="region" d="M362 236 Q400 203 438 236 L438 286 Q400 318 362 286Z"/>
 <path class="region" d="M330 360 Q400 382 470 360 L450 411 Q400 436 350 411Z"/>
 <path class="region" d="M122 196 L132 221 L159 224 L139 241 L144 268 L122 253 L100 268 L105 241 L85 224 L112 221Z"/><path class="region" d="M666 300 L676 325 L703 328 L683 345 L688 372 L666 357 L644 372 L649 345 L629 328 L656 325Z"/><path class="region" d="M178 93 L186 112 L206 115 L191 128 L195 148 L178 138 L161 148 L165 128 L150 115 L170 112Z"/>
 </g><circle class="eye" cx="345" cy="169" r="5"/><circle class="eye" cx="455" cy="169" r="5"/>
 </svg>`},
 {name:'Çiçek',title:'Neşeli Bahçe',emoji:'🌼',sky:'#fff4e8',svg:`<svg class="art" viewBox="0 0 800 520" role="img" aria-label="Boyanabilir çiçekli bahçe"><g>
 <path class="region" d="M59 420 Q110 376 172 421 Q220 383 276 422 L276 477 L59 477Z"/><path class="region" d="M524 420 Q574 375 626 420 Q687 378 746 420 L746 477 L524 477Z"/>
 <path class="region" d="M111 99 Q135 73 159 99 Q180 128 135 150 Q91 127 111 99Z"/><path class="region" d="M620 96 Q644 70 668 96 Q689 125 644 147 Q600 124 620 96Z"/>
 <path class="region" d="M390 197 Q385 255 393 311 L399 416 L418 416 L424 311 Q432 253 421 197Z"/>
 <path class="region" d="M403 321 Q356 265 319 289 Q338 343 403 353Z"/><path class="region" d="M409 355 Q460 288 496 310 Q480 362 409 382Z"/>
 <path class="region" d="M398 137 Q414 91 440 115 Q461 77 483 110 Q519 94 527 129 Q568 141 545 172 Q558 205 520 212 Q508 250 473 229 Q443 258 419 228 Q381 254 365 220 Q326 222 334 187 Q300 161 329 137 Q323 99 365 104 Q380 74 405 100Z"/>
 <path class="region" d="M147 318 Q165 289 182 318 Q211 290 225 321 Q257 322 248 350 Q266 370 238 384 Q240 412 210 409 Q186 433 166 410 Q134 421 129 391 Q99 380 116 354 Q104 328 134 321Z"/>
 <path class="region" d="M592 319 Q610 290 627 319 Q656 291 670 322 Q702 323 693 351 Q711 371 683 385 Q685 413 655 410 Q631 434 611 411 Q579 422 574 392 Q544 381 561 355 Q549 329 579 322Z"/>
 <path class="region" d="M351 443 Q380 425 400 443 Q420 425 444 443 L444 466 L351 466Z"/>
 </g><circle class="region" cx="400" cy="177" r="35"/><circle class="eye" cx="388" cy="171" r="4"/><circle class="eye" cx="412" cy="171" r="4"/><path class="line" d="M390 185 Q400 195 411 185"/>
 <circle class="region" cx="187" cy="360" r="23"/><circle class="region" cx="651" cy="360" r="23"/><circle class="eye" cx="180" cy="357" r="3"/><circle class="eye" cx="194" cy="357" r="3"/><circle class="eye" cx="644" cy="357" r="3"/><circle class="eye" cx="658" cy="357" r="3"/>
 </svg>`}
];
let current=0, selected=colors[0][0], eraser=false, soundOn=true, stars=0, audioCtx=null, painted=new Set();
const area=document.querySelector('#pictureArea'), palette=document.querySelector('#palette'),toast=document.querySelector('#toast');
function say(text){toast.textContent=text;toast.classList.add('show');clearTimeout(say.timer);say.timer=setTimeout(()=>toast.classList.remove('show'),1700)}
function render(){const p=pics[current];document.querySelector('#artTitle').textContent=p.title;document.querySelector('#titleEmoji').textContent=p.emoji;document.querySelector('#pictureName').textContent=p.name;area.style.background=p.sky;area.innerHTML=p.svg;document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===current));painted=new Set()}
colors.forEach(([color,name],i)=>{const b=document.createElement('button');b.className='palette-btn'+(!i?' selected':'');b.style.background=color;b.setAttribute('aria-label',name+' rengi');b.title=name;b.addEventListener('click',()=>{selected=color;eraser=false;document.querySelectorAll('.palette-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#eraserBtn').classList.remove('active')});palette.append(b)});
pics.forEach((p,i)=>{const b=document.createElement('button');b.className='dot'+(!i?' active':'');b.setAttribute('aria-label',p.name+' resmini aç');b.addEventListener('click',()=>{current=i;render()});document.querySelector('#dots').append(b)});
function paint(target){if(!target||!target.classList.contains('region'))return;const next=eraser?'#fffdf6':selected;if(target.getAttribute('fill')===next)return;target.setAttribute('fill',next);target.style.fill=next;target.classList.add('sparkle');setTimeout(()=>target.classList.remove('sparkle'),450);if(!eraser){painted.add(target);if(painted.size===3){stars++;document.querySelector('#stars').textContent=stars;say('Harika gidiyorsun! ⭐')}}if(soundOn)beep()}
area.addEventListener('pointerdown',e=>{const el=e.target.closest('.region');if(el){e.preventDefault();paint(el)}});area.addEventListener('pointermove',e=>{if(e.buttons){paint(e.target.closest('.region'))}});
document.querySelector('#eraserBtn').addEventListener('click',e=>{eraser=!eraser;e.currentTarget.classList.toggle('active',eraser);document.querySelectorAll('.palette-btn').forEach(x=>x.classList.remove('selected'));if(eraser)say('Silgi hazır! 🧽')});
document.querySelector('#clearBtn').addEventListener('click',()=>{area.querySelectorAll('.region').forEach(x=>{x.setAttribute('fill','#fffdf6');x.style.fill=''});painted.clear();say('Bembeyaz oldu! Yeni baştan 🎨')});
function step(n){current=(current+n+pics.length)%pics.length;render()};document.querySelector('#prevBtn').addEventListener('click',()=>step(-1));document.querySelector('#nextBtn').addEventListener('click',()=>step(1));
document.querySelector('#soundBtn').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 Ses':'🔇 Ses'});
function beep(){try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=500+Math.random()*350;gain.gain.setValueAtTime(.035,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.12);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.12)}catch{}}
document.querySelector('#saveBtn').addEventListener('click',()=>{const svg=area.querySelector('svg');const copy=svg.cloneNode(true);copy.setAttribute('xmlns','http://www.w3.org/2000/svg');copy.querySelectorAll('.region').forEach(x=>{x.setAttribute('fill',x.style.fill||x.getAttribute('fill')||'#fffdf6');x.setAttribute('stroke','#39364e')});const blob=new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='minik-ressam-'+pics[current].name.toLowerCase()+'.svg';a.click();URL.revokeObjectURL(url);say('Resmin cihazına kaydedildi! 📸')});
render();
</script>
</body>
</html>
